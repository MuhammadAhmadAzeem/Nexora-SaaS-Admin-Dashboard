<svg
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1200"
      y2="630"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#0F172A" />
      <stop offset="1" stop-color="#172554" />
    </linearGradient>

    <linearGradient
      id="brand"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop stop-color="#2563EB" />
      <stop offset="1" stop-color="#06B6D4" />
    </linearGradient>

    <filter
      id="blur"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >
      <feGaussianBlur stdDeviation="70" />
    </filter>
  </defs>

  <!-- Background -->
  <rect
    width="1200"
    height="630"
    fill="url(#background)"
  />

  <!-- Decorative Glow -->
  <circle
    cx="1000"
    cy="80"
    r="180"
    fill="#2563EB"
    opacity="0.18"
